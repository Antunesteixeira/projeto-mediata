{% extends '_layout/auth_base.html' %}

{% block conteudo %}
<section class="auth-card">
  <header class="auth-heading">
    <h1>Bem-vindo à Mediata</h1>
    <p>Entre para acompanhar sua operação.</p>
  </header>
  {% if form.non_field_errors %}
  <div class="alert alert-danger" role="alert">{{ form.non_field_errors }}</div>
  {% endif %}
  <form action="{% url 'login' %}" method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next|default:'' }}">
    <div class="mb-3">
      <label for="username" class="form-label">Usuário</label>
      <input type="text" class="form-control" id="username" name="username" value="{{ form.username.value|default:'' }}" placeholder="Digite seu usuário" autocomplete="username" required>
    </div>
    <div class="mb-4">
      <label for="senha" class="form-label">Senha</label>
      <input type="password" class="form-control" id="senha" name="password" placeholder="Digite sua senha" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Entrar</button>
    <p class="text-muted text-center mt-3 mb-0 small">Use as credenciais fornecidas pela sua empresa.</p>
  </form>
</section>
{% endblock %}
