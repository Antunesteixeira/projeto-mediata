name: Monitorar certificado TLS

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/renew-certificates.yml
      - scripts/check-tls.py
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitoramento-tls-mediata
  cancel-in-progress: false

jobs:
  monitor:
    name: Verificar o certificado público
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verificar validade, domínio e cadeia de confiança
        shell: bash
        run: |
          status=0
          report_file="$RUNNER_TEMP/tls-check.txt"
          python3 scripts/check-tls.py \
            --host mediatanordeste.com.br \
            --host www.mediatanordeste.com.br \
            --warning-days 30 \
            --critical-days 7 > "$report_file" 2>&1 || status=$?

          cat "$report_file"
          {
            echo "## Verificação do certificado público"
            echo
            echo '```text'
            cat "$report_file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          case "$status" in
            0) ;;
            1)
              echo "::warning title=Certificado TLS próximo do vencimento::Um certificado vence em menos de 30 dias. Consulte o relatório e a rotina de renovação da VM."
              exit 1
              ;;
            *)
              echo "::error title=Falha na verificação TLS::Certificado com menos de 7 dias de validade ou erro de conexão, domínio ou cadeia de confiança. Consulte o relatório."
              exit 1
              ;;
          esac
