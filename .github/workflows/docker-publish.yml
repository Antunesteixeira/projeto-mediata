name: Publicar imagem no Docker Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: producao-mediata
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Entrar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Preparar o Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir e publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/projeto-mediata:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/projeto-mediata:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Atualizar VM de produção
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Configurar acesso SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > ~/.ssh/mediata_deploy
          chmod 600 ~/.ssh/mediata_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Fazer backup e atualizar aplicação
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          ssh -i ~/.ssh/mediata_deploy "$VM_USER@$VM_HOST" 'bash -se' <<'DEPLOY'
          set -eu

          APP_DIR="$HOME/projeto-mediata"
          COMPOSE_FILE="docker-compose.prod.yml"
          IMAGE="antuneszi/projeto-mediata:latest"
          BACKUP_DIR="$HOME/mediata-vm-backup/automaticos"

          cd "$APP_DIR"
          mkdir -p "$BACKUP_DIR"

          BACKUP_FILE="$BACKUP_DIR/banco-$(date +%Y%m%d-%H%M%S).sql"
          docker exec psql_prod sh -c \
            'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"' > "$BACKUP_FILE"
          test -s "$BACKUP_FILE"

          PREVIOUS_IMAGE_ID="$(docker inspect mediataapp_prod \
            --format '{{.Image}}' 2>/dev/null || true)"

          docker pull "$IMAGE"
          docker compose -f "$COMPOSE_FILE" up -d \
            --no-deps --force-recreate mediataapp

          APP_READY=0
          for attempt in $(seq 1 18); do
            if docker exec mediataapp_prod \
              curl -fsS http://localhost:8000/health/ >/dev/null 2>&1; then
              APP_READY=1
              break
            fi
            sleep 5
          done

          if [ "$APP_READY" -ne 1 ]; then
            docker logs --tail=100 mediataapp_prod || true
            if [ -n "$PREVIOUS_IMAGE_ID" ]; then
              docker tag "$PREVIOUS_IMAGE_ID" "$IMAGE"
              docker compose -f "$COMPOSE_FILE" up -d \
                --no-deps --force-recreate mediataapp
              docker restart nginx_prod
            fi
            echo "A nova imagem não ficou saudável; rollback executado."
            exit 1
          fi

          docker restart nginx_prod
          find "$BACKUP_DIR" -type f -name 'banco-*.sql' -mtime +7 -delete

          docker inspect mediataapp_prod \
            --format 'Imagem={{.Config.Image}} Status={{.State.Status}}'
          DEPLOY
