name: Publicar imagem e atualizar VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: producao-mediata
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Entrar no Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Preparar o Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construir e publicar
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/projeto-mediata:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/projeto-mediata:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Atualizar VM de produção
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Configurar acesso SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > ~/.ssh/mediata_deploy
          chmod 600 ~/.ssh/mediata_deploy
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts

      - name: Fazer backup e atualizar aplicação
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          DEPLOY_IMAGE: antuneszi/projeto-mediata:${{ github.sha }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -i ~/.ssh/mediata_deploy "$VM_USER@$VM_HOST" \
            "bash -se -- $DEPLOY_IMAGE" <<'DEPLOY'
          set -eu

          APP_DIR="$HOME/projeto-mediata"
          IMAGE="$1"
          [[ "$IMAGE" =~ ^antuneszi/projeto-mediata:[a-f0-9]{40}$ ]] || exit 1
          CONTAINER="mediataapp_prod"
          NETWORK="projeto-mediata_mediata-network"
          BACKUP_DIR="$HOME/mediata-vm-backup/automaticos"

          cd "$APP_DIR"
          mkdir -p "$BACKUP_DIR"

          BACKUP_FILE="$BACKUP_DIR/banco-$(date +%Y%m%d-%H%M%S).sql"
          docker exec psql_prod sh -c \
            'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"' > "$BACKUP_FILE"
          test -s "$BACKUP_FILE"

          PREVIOUS_IMAGE_ID="$(docker inspect "$CONTAINER" \
            --format '{{.Image}}' 2>/dev/null || true)"

          start_app() {
            target_image="$1"
            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              --network "$NETWORK" \
              --network-alias mediataapp \
              --env-file "$APP_DIR/dotenv_files/.env.prod" \
              -e ENVIRONMENT=production \
              -v "$APP_DIR/data/web/static:/data/web/static" \
              -v "$APP_DIR/data/web/media:/data/web/media" \
              "$target_image"
          }

          rollback() {
            if [ -z "$PREVIOUS_IMAGE_ID" ]; then
              echo "Nenhuma imagem anterior disponível para rollback."
              return 1
            fi
            if ! start_app "$PREVIOUS_IMAGE_ID"; then
              echo "Falha ao reiniciar a imagem anterior."
              return 1
            fi
            if ! docker restart nginx_prod; then
              echo "Imagem anterior iniciada, mas o Nginx não reiniciou."
              return 1
            fi
            echo "Rollback para a imagem anterior executado."
          }

          docker pull "$IMAGE"
          if ! start_app "$IMAGE"; then
            echo "O novo contêiner não iniciou."
            rollback || true
            exit 1
          fi

          APP_READY=0
          for attempt in $(seq 1 18); do
            if docker exec "$CONTAINER" \
              curl -fsS \
                -H 'Host: mediatanordeste.com.br' \
                http://localhost:8000/health/ >/dev/null 2>&1; then
              APP_READY=1
              break
            fi
            sleep 5
          done

          if [ "$APP_READY" -ne 1 ]; then
            docker logs --tail=100 "$CONTAINER" || true
            rollback || true
            echo "A nova imagem não ficou saudável. Consulte o resultado do rollback acima."
            exit 1
          fi

          if ! docker restart nginx_prod; then
            echo "Falha ao reiniciar o Nginx após o deploy."
            rollback || true
            exit 1
          fi
          find "$BACKUP_DIR" -type f -name 'banco-*.sql' -mtime +7 -delete

          docker inspect "$CONTAINER" \
            --format 'Imagem={{.Config.Image}} Status={{.State.Status}}'
          DEPLOY
