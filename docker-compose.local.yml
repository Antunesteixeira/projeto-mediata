services:
  mediataapp:
    build: .
    container_name: mediataapp_dev
    command: ["sh", "/scripts/development.sh"]
    env_file:
      - ./dotenv_files/.env.dev
    volumes:
      - ./mediataapp:/mediataapp
      - ./data/web/static:/data/web/static
      - media_dev:/data/web/media
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ENVIRONMENT: development
      DJANGO_SETTINGS_MODULE: mediata.dev_settings
      HOME: /tmp/mediata-dev-home
    depends_on:
      psql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health/"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  psql:
    container_name: psql_dev
    image: postgres:15-alpine
    env_file:
      - ./dotenv_files/.env.dev
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata_dev:
  media_dev:
